<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BreakLoop Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #20263a;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
        }

        h1 {
            margin: 0 0 8px;
        }

        .subtitulo {
            color: #687086;
            margin: 0;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #5546d7;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .indicadores {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px;
            margin-bottom: 24px;
        }

        .tarjeta,
        .panel {
            background: white;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 3px 12px #20263a10;
        }

        .tarjeta h3 {
            margin: 0 0 16px;
            color: #687086;
            font-size: 14px;
            font-weight: normal;
        }

        .valor {
            font-size: 30px;
            font-weight: bold;
        }

        .graficas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
        }

        .panel h2 {
            font-size: 18px;
            margin-top: 0;
        }

        .contenedor-grafica {
            position: relative;
            height: 300px;
        }

        #estado {
            margin-top: 22px;
            color: #687086;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 18px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1>BreakLoop Analytics</h1>
            <p class="subtitulo">
                Panel de análisis de sesiones de enfoque
            </p>
        </div>

        <button id="actualizar" onclick="cargarAnaliticas()">
            Actualizar datos
        </button>
    </header>

    <section class="indicadores">
        <article class="tarjeta">
            <h3>Total de sesiones</h3>
            <div class="valor" id="total">—</div>
        </article>

        <article class="tarjeta">
            <h3>Sesiones completadas</h3>
            <div class="valor" id="completadas">—</div>
        </article>

        <article class="tarjeta">
            <h3>Sesiones abandonadas</h3>
            <div class="valor" id="abandonadas">—</div>
        </article>

        <article class="tarjeta">
            <h3>Tasa de finalización</h3>
            <div class="valor" id="porcentaje">—</div>
        </article>

        <article class="tarjeta">
            <h3>Duración promedio</h3>
            <div class="valor" id="duracion">—</div>
        </article>
    </section>

    <section class="graficas">
        <article class="panel">
            <h2>Estado de las sesiones</h2>
            <div class="contenedor-grafica">
                <canvas id="estados"></canvas>
            </div>
        </article>

        <article class="panel">
            <h2>Número de sesiones por estado</h2>
            <div class="contenedor-grafica">
                <canvas id="distribucion"></canvas>
            </div>
        </article>
    </section>

    <p id="estado">Conectando con el servicio de analytics...</p>

    <script>
        let graficaEstados = null;
        let graficaDistribucion = null;

        async function cargarAnaliticas() {
            const boton = document.getElementById("actualizar");
            const estado = document.getElementById("estado");

            boton.disabled = true;
            estado.textContent = "Consultando datos...";

            try {
                const respuesta = await fetch("/api/analytics/focus", {
                    headers: {
                        "Accept": "application/json"
                    }
                });

                if (!respuesta.ok) {
                    throw new Error(`Error HTTP ${respuesta.status}`);
                }

                const datos = await respuesta.json();

                const total = Number(datos.totalSessions ?? 0);
                const completadas = Number(datos.completedSessions ?? 0);
                const abandonadas = Number(datos.abandonedSessions ?? 0);
                const porcentaje = Number(datos.completionPercentage ?? 0);
                const duracion = Number(datos.averageDurationSeconds ?? 0);

                document.getElementById("total").textContent = total;
                document.getElementById("completadas").textContent =
                    completadas;
                document.getElementById("abandonadas").textContent =
                    abandonadas;
                document.getElementById("porcentaje").textContent =
                    porcentaje.toFixed(1) + "%";
                document.getElementById("duracion").textContent =
                    (duracion / 60).toFixed(1) + " min";

                const otros = Math.max(
                    0, total - completadas - abandonadas
                );

                const etiquetas = [
                    "Completadas",
                    "Abandonadas",
                    "Otros estados"
                ];

                const valores = [completadas, abandonadas, otros];

                if (graficaEstados) {
                    graficaEstados.data.datasets[0].data = valores;
                    graficaEstados.update();
                } else {
                    graficaEstados = new Chart(
                        document.getElementById("estados"),
                        {
                            type: "doughnut",
                            data: {
                                labels: etiquetas,
                                datasets: [{
                                    data: valores
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false
                            }
                        }
                    );
                }

                if (graficaDistribucion) {
                    graficaDistribucion.data.datasets[0].data = valores;
                    graficaDistribucion.update();
                } else {
                    graficaDistribucion = new Chart(
                        document.getElementById("distribucion"),
                        {
                            type: "bar",
                            data: {
                                labels: etiquetas,
                                datasets: [{
                                    label: "Sesiones",
                                    data: valores
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                scales: {
                                    y: {
                                        beginAtZero: true,
                                        ticks: {
                                            precision: 0
                                        }
                                    }
                                }
                            }
                        }
                    );
                }

                estado.textContent =
                    "Datos actualizados correctamente.";

            } catch (error) {
                estado.textContent =
                    "No fue posible cargar las métricas: " + error.message;
            } finally {
                boton.disabled = false;
            }
        }

        cargarAnaliticas();
    </script>
</body>

</html>
